                <span

                  x-show="lang===item.id"

                <div class="flex flex-wrap gap-3">

    <div

      class="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-ink/80 backdrop-blur-sm"
      role="dialog"
      aria-modal="true"
      :aria-label="cert ? cert.title : 'Certificate'"
      @click.self="closeCert()"
    >
      <div
        class="relative w-full max-w-4xl max-h-[90vh] overflow-auto bg-paper dark:bg-[#151c24] rounded-3xl p-4 md:p-6"
        @click.stop
      >
        <button
          type="button"
          class="absolute top-3 right-3 z-10 w-9 h-9 flex items-center justify-center rounded-xl bg-ink/5 dark:bg-white/10 hover:bg-accent hover:text-ink transition-colors"
          @click="closeCert()"
          aria-label="Close certificate"
        >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
